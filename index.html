      <div class="tabs" id="status-tabs">

      <p class="count" id="result-count"></p>
      <button id="clear-checked" class="link-btn" hidden>Clear checked-off items</button>
    </div>

    <div id="sections">
      <section class="status-section" id="section-trip" hidden>
        <h2 class="section-title trip"><span id="trip-title"></span> <span class="section-count" id="trip-count"></span></h2>
        <div class="grid" id="grid-trip"></div>
      </section>
      <section class="status-section" id="section-need">
        <h2 class="section-title need">🛒 Need to Buy <span class="section-count" id="need-count"></span></h2>
        <div class="grid" id="grid-need"></div>
      </section>
      <section class="status-section" id="section-have">
        <h2 class="section-title have">✅ Have in Kitchen <span class="section-count" id="have-count"></span></h2>
        <div class="grid" id="grid-have"></div>
      </section>
    </div>
    <p class="empty" id="empty-msg" hidden>No ingredients match your filters.</p>
  </main>

  <footer>
    <p>Generated from kitchen photos · <span id="total-count"></span> ingredients tracked</p>
  </footer>

        { "amount": "1/2 tsp", "label": "Paprika", "item": "Paprika" },
        { "amount": "1/4 tsp", "label": "Black pepper", "item": "Venetian Gold Ground Black Pepper" },
        { "amount": "1/2 tsp", "label": "Salt", "item": "Unlabeled jar, white granular (salt or sugar)", "note": "Taste the jar before using — it may be sugar" },
        { "amount": "1/4 tsp", "label": "Cumin", "item": "Ground Cumin" },
        { "amount": "1/4 tsp", "label": "Coriander", "item": "Ground Coriander" },
        { "amount": "1/2 tsp", "label": "Oregano", "item": "Supreme Tradition Oregano Leaves" },
        { "amount": "1 cup", "label": "Beef stock", "item": "Beef Stock" },
        { "amount": "1/4 cup", "label": "Fresh cilantro, finely chopped", "item": "Fresh Cilantro" },
        { "amount": "1/2 cup", "label": "Shredded chihuahua or mozzarella cheese", "item": "Shredded Cheese (chihuahua or mozzarella)" },
        { "amount": "to serve", "label": "Tortillas, or rice", "item": "Tortillas (or rice)" }

      "steps": [
        "Heat a large skillet over medium-high heat and add in the oil and cubed beef. Sear the beef for about 2-3 minutes on all sides until they are golden brown. Sprinkle in the flour over all the beef and add the tomato paste. Stir to coat the beef evenly and reduce the heat to medium.",
        "Add in the diced onion, bell pepper, jalapeño, tomato and garlic and cook, stirring, for about 3-4 minutes until the onions and peppers have softened. Add in the chipotle chili powder, paprika, black pepper, salt, cumin, coriander and oregano and stir to combine.",
