<title>Meal Prep Log</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>🥡 Meal Prep Log</h1>
      <p class="subtitle">What got prepped, per week — updated <span id="updated-date"></span></p>
      <nav class="page-nav">
        <a href="index.html">🍳 Ingredients</a>
        <a href="meal-prep.html" class="active">🥡 Meal Prep Log</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="count-row">
      <p class="count"><span id="entry-count"></span> logged meal preps</p>
    </div>

    <div id="weeks"></div>
    <p class="empty" id="empty-msg" hidden>No meal preps logged yet — add one to <code>meal-prep-log.json</code>.</p>
  </main>

  <footer>
    <p>Container checkboxes are saved in this browser only (localStorage), not synced across devices.</p>
  </footer>

  <script id="meal-prep-data" type="application/json">
